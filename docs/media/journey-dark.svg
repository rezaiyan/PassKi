rial, sans-serif" font-size="9.5" font-weight="700" fill="#9198a1" text-anchor="start">UNDERNEATH</text><line x1="642" y1="342" x2="642" y2="504" stroke="#30363d" stroke-width="2"/><g class="row0" style="animation-delay:10.40s"><circle cx="642" cy="342" r="5" fill="#3fb950" stroke="#161b22" stroke-width="2"/><text x="656" y="345.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><text x="656" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Sends request options with a new</text><text x="656" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">challenge. No username needed.</text></g><g class="row1" style="animation-delay:11.30s"><circle cx="642" cy="396" r="5" fill="#a78bfa" stroke="#161b22" stroke-width="2"/><text x="656" y="399.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#a78bfa" text-anchor="start">PASSKI</text><text x="656" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="start">passkeys.signIn(options)</text><text x="656" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">shows alice&#x27;s passkey.</text></g><g class="row2" style="animation-delay:12.20s"><circle cx="642" cy="450" r="5" fill="#4493f8" stroke="#161b22" stroke-width="2"/><text x="656" y="453.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#4493f8" text-anchor="start">THE DEVICE</text><text x="656" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Her fingerprint unlocks the private</text><text x="656" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">key, which signs the challenge.</text></g><g class="row3" style="animation-delay:13.10s"><circle cx="642" cy="504" r="5" fill="#3fb950" stroke="#161b22" stroke-width="2"/><text x="656" y="507.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><text x="656" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Checks the signature with the</text><text x="656" y="539" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">stored public key: she&#x27;s signed in.</text></g></svg>
