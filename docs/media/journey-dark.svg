<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" role="img" aria-label="The user&#x27;s journey with PassKi: 1. they sign in as today, with a password, Google or Apple; 2. signed in, they add a passkey in Settings (passkeys.register); 3. next time they sign in with one tap (passkeys.signIn). Underneath: the device creates a key pair whose private key never leaves it, your server stores the public key, and later checks the device&#x27;s signature of a fresh challenge with it."><title>The user&#x27;s journey with PassKi: 1. they sign in as today, with a password, Google or Apple; 2. signed in, they add a passkey in Settings (passkeys.register); 3. next time they sign in with one tap (passkeys.signIn). Underneath: the device creates a key pair whose private key never leaves it, your server stores the public key, and later checks the device&#x27;s signature of a fresh challenge with it.</title><style>.row0{animation:row0 15s ease-out infinite backwards}@keyframes row0{0%{opacity:.5}3%{opacity:1}30.7%{opacity:1}33.7%{opacity:.5}100%{opacity:.5}}.row1{animation:row1 15s ease-out infinite backwards}@keyframes row1{0%{opacity:.5}3%{opacity:1}24.7%{opacity:1}27.7%{opacity:.5}100%{opacity:.5}}.row2{animation:row2 15s ease-out infinite backwards}@keyframes row2{0%{opacity:.5}3%{opacity:1}18.7%{opacity:1}21.7%{opacity:.5}100%{opacity:.5}}.row3{animation:row3 15s ease-out infinite backwards}@keyframes row3{0%{opacity:.5}3%{opacity:1}12.7%{opacity:1}15.7%{opacity:.5}100%{opacity:.5}}.stage{opacity:0;animation:stage 15s ease-in-out infinite}@keyframes stage{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}.sheet{animation:sheet 15s ease-out infinite backwards}@keyframes sheet{0%{transform:translateY(106px)}8%{transform:translateY(0)}100%{transform:translateY(0)}}.traveller{animation:traveller 15s ease-in-out infinite}@keyframes traveller{0%,25%{transform:translateX(0)}33%,58%{transform:translateX(308px)}66%,92%{transform:translateX(616px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><line x1="142.0" y1="22" x2="758.0" y2="22" stroke="#30363d" stroke-width="2"/><circle class="traveller" cx="142.0" cy="22" r="4" fill="#a78bfa"/><circle cx="142.0" cy="22" r="12" fill="#3fb950"/><text x="142.0" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="142.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Sign in as today</text><rect x="0" y="70" width="284" height="496" rx="14" fill="#161b22" stroke="#30363d"/><rect class="stage" style="animation-delay:0s" x="0" y="70" width="284" height="496" rx="14" fill="none" stroke="#3fb950" stroke-width="2"/><clipPath id="screen0"><rect x="77.0" y="89" width="130" height="204" rx="14"/></clipPath><rect x="72.0" y="84" width="140" height="214" rx="19" fill="#0d1117" stroke="#30363d" stroke-width="2"/><rect x="126.0" y="93" width="32" height="6" rx="3" fill="#30363d" /><g clip-path="url(#screen0)"><text x="86.0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start">Sign in</text><rect x="86.0" y="138" width="112" height="16" rx="4" fill="#21262d" /><rect x="86.0" y="160" width="112" height="16" rx="4" fill="#21262d" /><rect x="86.0" y="186" width="112" height="18" rx="9" fill="#e6edf3" /><text x="142.0" y="198.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#0d1117" text-anchor="middle">Sign in</text><text x="142.0" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#9198a1" text-anchor="middle">or</text><rect x="86.0" y="228" width="112" height="18" rx="9" fill="#0d1117" stroke="#30363d"/><text x="142.0" y="240.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Continue with Google</text></g><line x1="20" y1="314" x2="264" y2="314" stroke="#30363d"/><text x="20" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9198a1" text-anchor="start">UNDERNEATH</text><line x1="26" y1="342" x2="26" y2="450" stroke="#30363d" stroke-width="2"/><g class="row0" style="animation-delay:0.40s"><circle cx="26" cy="342" r="5" fill="#e6edf3" stroke="#161b22" stroke-width="2"/><text x="40" y="345.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#e6edf3" text-anchor="start">YOUR APP</text><text x="40" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Sends the password, or the Google</text><text x="40" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">or Apple token, as it does today.</text></g><g class="row1" style="animation-delay:1.30s"><circle cx="26" cy="396" r="5" fill="#3fb950" stroke="#161b22" stroke-width="2"/><text x="40" y="399.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><text x="40" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Checks it and starts a session</text><text x="40" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">for alice. Nothing changes here.</text></g><g class="row2" style="animation-delay:2.20s"><circle cx="26" cy="450" r="5" fill="#9198a1" stroke="#161b22" stroke-width="2"/><text x="40" y="453.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9198a1" text-anchor="start">NO PASSKEY YET</text><text x="40" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Signed in, alice can now add one</text><text x="40" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">in Settings.</text></g><circle cx="450.0" cy="22" r="12" fill="#a78bfa"/><text x="450.0" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="450.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Add a passkey</text><rect x="308" y="70" width="284" height="496" rx="14" fill="#161b22" stroke="#30363d"/><rect class="stage" style="animation-delay:5s" x="308" y="70" width="284" height="496" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/><clipPath id="screen1"><rect x="385.0" y="89" width="130" height="204" rx="14"/></clipPath><rect x="380.0" y="84" width="140" height="214" rx="19" fill="#0d1117" stroke="#30363d" stroke-width="2"/><rect x="434.0" y="93" width="32" height="6" rx="3" fill="#30363d" /><g clip-path="url(#screen1)"><text x="394.0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start">Settings</text><rect x="394.0" y="138" width="112" height="14" rx="4" fill="#21262d" /><rect x="394.0" y="158" width="112" height="14" rx="4" fill="#21262d" /><rect x="394.0" y="178" width="112" height="16" rx="4" fill="#a78bfa" opacity="0.18"/><circle cx="404.0" cy="186" r="4.5" fill="none" stroke="#a78bfa" stroke-width="2"/><path d="M408.5 186 h9 v3 M414.0 186 v3" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/><text x="424.0" y="189.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#e6edf3" text-anchor="start">Add a passkey</text><g class="sheet" style="animation-delay:5s"><rect x="385.0" y="206" width="130" height="100" rx="14" fill="#1c2128" stroke="#30363d"/><text x="450.0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#e6edf3" text-anchor="middle">Save a passkey?</text><circle cx="450.0" cy="248" r="17" fill="#4493f8" opacity="0.12"/><path d="M446.0 250 a4 4 0 0 1 8 0" fill="none" stroke="#4493f8" stroke-width="1.6" stroke-linecap="round"/><path d="M442.0 250 a8 8 0 0 1 16 0" fill="none" stroke="#4493f8" stroke-width="1.6" stroke-linecap="round"/><path d="M438.0 250 a12 12 0 0 1 24 0" fill="none" stroke="#4493f8" stroke-width="1.6" stroke-linecap="round"/><rect x="402.0" y="269" width="96" height="18" rx="9" fill="#4493f8" /><text x="450.0" y="281.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="middle">Continue</text></g></g><line x1="328" y1="314" x2="572" y2="314" stroke="#30363d"/><text x="328" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9198a1" text-anchor="start">UNDERNEATH</text><line x1="334" y1="342" x2="334" y2="504" stroke="#30363d" stroke-width="2"/><g class="row0" style="animation-delay:5.40s"><circle cx="334" cy="342" r="5" fill="#3fb950" stroke="#161b22" stroke-width="2"/><text x="348" y="345.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><text x="348" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Sends creation options: a fresh</text><text x="348" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">challenge, alice&#x27;s user handle, rp.id.</text></g><g class="row1" style="animation-delay:6.30s"><circle cx="334" cy="396" r="5" fill="#a78bfa" stroke="#161b22" stroke-width="2"/><text x="348" y="399.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#a78bfa" text-anchor="start">PASSKI</text><text x="348" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="start">passkeys.register(options)</text><text x="348" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">shows the system sheet.</text></g><g class="row2" style="animation-delay:7.20s"><circle cx="334" cy="450" r="5" fill="#4493f8" stroke="#161b22" stroke-width="2"/><text x="348" y="453.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#4493f8" text-anchor="start">THE DEVICE</text><text x="348" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Makes a new key pair. The private</text><text x="348" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">key stays in her password manager.</text></g><g class="row3" style="animation-delay:8.10s"><circle cx="334" cy="504" r="5" fill="#3fb950" stroke="#161b22" stroke-width="2"/><text x="348" y="507.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><text x="348" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Verifies the response, then stores</text><text x="348" y="539" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">the public key and credential ID.</text></g><circle cx="758.0" cy="22" r="12" fill="#4493f8"/><text x="758.0" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="758.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Next time: one tap</text><rect x="616" y="70" width="284" height="496" rx="14" fill="#161b22" stroke="#30363d"/><rect class="stage" style="animation-delay:10s" x="616" y="70" width="284" height="496" rx="14" fill="none" stroke="#4493f8" stroke-width="2"/><clipPath id="screen2"><rect x="693.0" y="89" width="130" height="204" rx="14"/></clipPath>