<svg xmlns="http://www.w3.org/2000/svg" width="904" height="254" viewBox="0 0 904 254" role="img" aria-label="How a passkey sign-in works with PassKi: your server creates options, PassKi shows the native sheet, the user confirms, your server verifies the response."><title>How a passkey sign-in works with PassKi: your server creates options, PassKi shows the native sheet, the user confirms, your server verifies the response.</title><style>.focus{opacity:0;animation:focus 8s ease-in-out infinite}@keyframes focus{0%{opacity:0}5%{opacity:1}20%{opacity:1}25%{opacity:0}100%{opacity:0}}.packet{opacity:0;animation:packet 8s ease-in-out infinite}@keyframes packet{0%{opacity:0;transform:translateX(0)}1.5%{opacity:1}5%{opacity:1;transform:translateX(18px)}6.5%{opacity:0;transform:translateX(18px)}100%{opacity:0;transform:translateX(18px)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><rect x="12" y="44" width="196" height="168" rx="12" fill="#161b22" stroke="#30363d"/><rect x="12" y="44" width="196" height="4" rx="2" fill="#3fb950"/><circle cx="42" cy="82" r="15" fill="#3fb950"/><text x="42" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="66" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Create options</text><text x="28" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">A fresh challenge for this</text><text x="28" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">sign-in, as WebAuthn JSON.</text><rect x="24" y="166" width="172" height="28" rx="6" fill="#21262d"/><text x="110.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="middle">POST /sign-in-options</text><rect class="focus" style="animation-delay:0s" x="12" y="44" width="196" height="168" rx="12" fill="none" stroke="#3fb950" stroke-width="2"/><line x1="214" y1="128" x2="227" y2="128" stroke="#6e7681" stroke-width="2"/><path d="M227 123 L234 128 L227 133 Z" fill="#6e7681"/><circle class="packet" style="animation-delay:1.55s" cx="215" cy="128" r="3.5" fill="#a78bfa"/><text x="244" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="start">PASSKI</text><rect x="240" y="44" width="196" height="168" rx="12" fill="#161b22" stroke="#30363d"/><rect x="240" y="44" width="196" height="4" rx="2" fill="#a78bfa"/><circle cx="270" cy="82" r="15" fill="#a78bfa"/><text x="270" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="294" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Show the sheet</text><text x="256" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">One call from commonMain.</text><text x="256" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">No Activity, no UIWindow.</text><rect x="252" y="166" width="172" height="28" rx="6" fill="#21262d"/><text x="338.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="middle">passkeys.signIn(options)</text><rect class="focus" style="animation-delay:2s" x="240" y="44" width="196" height="168" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/><line x1="442" y1="128" x2="455" y2="128" stroke="#6e7681" stroke-width="2"/><path d="M455 123 L462 128 L455 133 Z" fill="#6e7681"/><circle class="packet" style="animation-delay:3.55s" cx="443" cy="128" r="3.5" fill="#4493f8"/><text x="472" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4493f8" text-anchor="start">THE DEVICE</text><rect x="468" y="44" width="196" height="168" rx="12" fill="#161b22" stroke="#30363d"/><rect x="468" y="44" width="196" height="4" rx="2" fill="#4493f8"/><circle cx="498" cy="82" r="15" fill="#4493f8"/><text x="498" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="522" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">User confirms</text><text x="484" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">Face, fingerprint or screen</text><text x="484" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">lock. The device signs.</text><rect x="480" y="166" width="172" height="28" rx="6" fill="#21262d"/><text x="566.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="middle">Android · iOS · web</text><rect class="focus" style="animation-delay:4s" x="468" y="44" width="196" height="168" rx="12" fill="none" stroke="#4493f8" stroke-width="2"/><line x1="670" y1="128" x2="683" y2="128" stroke="#6e7681" stroke-width="2"/><path d="M683 123 L690 128 L683 133 Z" fill="#6e7681"/><circle class="packet" style="animation-delay:5.55s" cx="671" cy="128" r="3.5" fill="#3fb950"/><text x="700" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="start">YOUR SERVER</text><rect x="696" y="44" width="196" height="168" rx="12" fill="#161b22" stroke="#30363d"/><rect x="696" y="44" width="196" height="4" rx="2" fill="#3fb950"/><circle cx="726" cy="82" r="15" fill="#3fb950"/><text x="726" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="750" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Verify, sign in</text><text x="712" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">Signature, challenge, origin</text><text x="712" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="start">and RP ID, then a session.</text><rect x="708" y="166" width="172" height="28" rx="6" fill="#21262d"/><text x="794.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#e6edf3" text-anchor="middle">POST /sign-in  (it.json)</text><rect class="focus" style="animation-delay:6s" x="696" y="44" width="196" height="168" rx="12" fill="none" stroke="#3fb950" stroke-width="2"/><text x="452.0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9198a1" text-anchor="middle">Options JSON in, response JSON out: PassKi passes both through unchanged, and your server stays in charge.</text></svg>
