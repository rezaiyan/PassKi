name: Release

# Publishes the libraries (passki, passki-compose, passki-test, passki-demo), the BOM (passki-bom) and the Gradle plugin
# to Maven Central, waits until they resolve from repo1.maven.org, then creates the GitHub Release (notes from
# CHANGELOG.md) and publishes the API reference to GitHub Pages.
#
# - Push a tag v<VERSION_NAME> (e.g. v0.1.0-alpha02): builds, signs, checks the signatures, then uploads two deployments
#   (libraries, Gradle plugin) to the Central Portal and releases each one as soon as Central has validated it. There
#   is no manual Publish step: pushing the tag is the release, and a Maven Central release can't be taken back.
#   Libraries go first; if the plugin then fails validation, the libraries are already out and the fix is a new version.
# - "Run workflow" by hand: a dry run. Same build, signing and signature check, but nothing leaves the runner. To
#   check an already-released version instead, give its number as "verify_version": only verify-published runs.
#
# Runs on macOS: only a Mac can build the iOS klibs, and Central needs every target in one release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_version:
        description: Only check that this released version resolves from Maven Central (e.g. 0.1.0-alpha04)
        required: false
        default: ''
      verify_minutes:
        description: How long to wait for Maven Central, in minutes
        required: false
        default: '75'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Read by com.vanniktech.maven.publish as Gradle properties.
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
  # Public half of SIGNING_KEY, as published on keys.openpgp.org. Central checks signatures against it.
  SIGNING_KEY_ID: F6A6884708D12D47

jobs:
  publish:
    name: Publish to Maven Central
    if: inputs.verify_version == ''
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Tag matches VERSION_NAME
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in gradle.properties (expected v$version)"
            exit 1
          fi

      - name: Signing secrets present
        run: |
          missing=""
          for name in ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error::Empty secrets:$missing (see the env block of this workflow for the secret names)"
            exit 1
          fi

      # Signed artifacts land in Maven Local first, so the next step can check them before anything is uploaded.
      - name: Build and sign into Maven Local
        run: |
          ./gradlew :passki:publishToMavenLocal :passki-compose:publishToMavenLocal :passki-test:publishToMavenLocal :passki-demo:publishToMavenLocal :passki-bom:publishToMavenLocal
          ./gradlew -p passki-gradle-plugin publishToMavenLocal

      # On macOS so the reference includes the iOS source sets; the pages job publishes it.
      - name: API reference
        run: ./gradlew dokkaGenerate
      - uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: build/dokka/html

      - name: Published classes load on Java 11 (libraries) and Java 17 (Gradle plugin)
        run: python3 ci/check-jvm-bytecode.py

      - name: Every file is signed with the published key
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$SIGNING_KEY_ID"
          root="$HOME/.m2/repository/com/alirezaiyan/passki"
          checked=0; failed=0
          while IFS= read -r file; do
            if gpg --batch --verify "$file.asc" "$file" 2>/dev/null; then
              checked=$((checked + 1))
            else
              echo "::error::Missing or bad signature: ${file#"$root"/}"
              failed=$((failed + 1))
            fi
          done < <(find "$root" -path "*/$version/*" -type f ! -name '*.asc' ! -name '*.md5' ! -name '*.sha*')
          echo "$checked files signed by $SIGNING_KEY_ID, $failed failed"
          [ "$checked" -gt 0 ] && [ "$failed" -eq 0 ]

      # --no-configuration-cache: the Central upload task does not support the configuration cache.
      - name: Upload to the Central Portal and release
        if: github.ref_type == 'tag'
        run: |
          ./gradlew --no-configuration-cache :passki:publishAndReleaseToMavenCentral :passki-compose:publishAndReleaseToMavenCentral :passki-test:publishAndReleaseToMavenCentral :passki-demo:publishAndReleaseToMavenCentral :passki-bom:publishAndReleaseToMavenCentral
          ./gradlew --no-configuration-cache -p passki-gradle-plugin publishAndReleaseToMavenCentral

      - name: Next step
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "Uploaded and released to Maven Central; verify-published waits until every artifact resolves." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run passed: everything builds and is signed with $SIGNING_KEY_ID. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Separate from publish so the macOS runner isn't held while Central syncs (often 10-30 minutes).
  verify-published:
    name: Every artifact resolves from Maven Central
    needs: publish
    if: always() && (github.ref_type == 'tag' && needs.publish.result == 'success' || inputs.verify_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Wait for repo1.maven.org
        run: |
          version="${{ inputs.verify_version }}"
          [ -n "$version" ] || version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          python3 ci/published-artifacts.py --verify "$version" --timeout-minutes "${{ inputs.verify_minutes || '75' }}"

  # The GitHub Release for the tag: its CHANGELOG section plus install lines. Alphas and betas are pre-releases.
  github-release:
    name: GitHub Release
    needs: verify-published
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          python3 ci/release-notes.py "$version" > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$version" --title "PassKi $version" --notes-file notes.md --verify-tag $prerelease
          echo "GitHub Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$version" >> "$GITHUB_STEP_SUMMARY"

  # One folder per version on the gh-pages branch, plus latest/: https://rezaiyan.github.io/PassKi/
  api-reference:
    name: Publish the API reference
    needs: [publish, verify-published]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: api-reference
          path: api-reference
      - name: Write the version to gh-pages
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add pages gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          python3 ci/api-reference-pages.py --version "$version" --html api-reference --pages pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "API reference $version"
          git push origin gh-pages
          echo "API reference: https://rezaiyan.github.io/PassKi/$version/" >> "$GITHUB_STEP_SUMMARY"
